<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#668d7c">
  <meta name="description" content="Materna-JO — رفيقتك في الحمل وما بعد الولادة">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Materna-JO | رفيقتك في الأمومة</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="change-mode" aria-label="تغيير الحالة" title="تغيير الحالة">↺</button>
      <div class="brand"><span class="brand-mark">✿</span><span>Materna<span class="brand-j">-JO</span></span></div>
      <button class="icon-btn" id="lang-toggle" aria-label="Change language" title="العربية / English">ع</button>
    </header>
    <main id="main-content">
      <section id="welcome-screen" class="welcome-screen">
        <div class="welcome-art">
          <div class="sun"></div><div class="leaf leaf-one"></div><div class="leaf leaf-two"></div>
          <div class="mother-illustration">♡</div>
          <span class="art-star star-one">✦</span><span class="art-star star-two">✧</span>
        </div>
        <p class="eyebrow">رفيقتكِ في كل خطوة</p>
        <h1>أهلاً بكِ يا أمي <span>♡</span></h1>
        <p class="welcome-copy">مساحة دافئة للاهتمام بكِ وبطفلكِ، يومًا بعد يوم.</p>
        <div class="choice-list">
          <button class="choice-card" data-mode="pregnant">
            <span class="choice-emoji">🤰</span><span class="choice-text"><b>أنا حامل</b><small>تابعي حملكِ واعتني بصحتكِ</small></span><span class="arrow">←</span>
          </button>
          <button class="choice-card" data-mode="newmom">
            <span class="choice-emoji">👩‍🍼</span><span class="choice-text"><b>أنا أم جديدة</b><small>رعايتكِ ورعاية طفلكِ معًا</small></span><span class="arrow">←</span>
          </button>
        </div>
        <p class="privacy-note">🔒 لا تحتاجين إلى إنشاء حساب. تُحفظ بياناتكِ على هذا الجهاز.</p>
      </section>

      <section id="app-screen" class="hidden">
        <div class="page-heading">
          <div><p class="eyebrow" id="page-eyebrow">مساحتكِ الآمنة</p><h1 id="page-title">أهلاً بكِ يا أمي</h1></div>
          <span class="heading-flower">✿</span>
        </div>
        <div id="content"></div>
      </section>
    </main>
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="التنقل الرئيسي">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>الرئيسية</small></button>
      <button data-page="care" class="nav-item"><span>♡</span><small>رعايتكِ</small></button>
      <button data-page="baby" class="nav-item"><span>☼</span><small id="baby-nav-label">الطفل</small></button>
      <button data-page="mental" class="nav-item"><span>☁</span><small>مزاجكِ</small></button>
      <button data-page="support" class="nav-item"><span>☏</span><small>الدعم</small></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
